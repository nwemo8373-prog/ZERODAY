<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>NEGM AI - Pro</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    background:#09090d;
    color:#fff;
    font-family:
        Arial,
        "Tahoma",
        sans-serif;
}

body{
    overflow:hidden;
}

.app{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
}

/* ================= HEADER ================= */

.header{
    height:115px;
    min-height:115px;
    background:#111116;
    border-bottom:1px solid #292930;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 25px;
}

.brand{
    text-align:right;
}

.brand h1{
    color:#00f5d4;
    font-size:30px;
    font-weight:800;
    line-height:1.25;
}

.brand p{
    color:#888;
    font-size:13px;
    margin-top:4px;
}

.connection{
    color:#00f5d4;
    font-size:18px;
    text-align:center;
    line-height:1.5;
}

.dot{
    display:inline-block;
    width:9px;
    height:9px;
    background:#00f5d4;
    border-radius:50%;
    margin-right:4px;
    box-shadow:0 0 10px #00f5d4;
}

/* ================= CHAT ================= */

.chat{
    flex:1;
    overflow-y:auto;
    padding:35px 18px 150px;
    scroll-behavior:smooth;
}

.chat::-webkit-scrollbar{
    width:5px;
}

.chat::-webkit-scrollbar-thumb{
    background:#303038;
    border-radius:20px;
}

.message{
    width:100%;
    display:flex;
    margin-bottom:20px;
}

.message.ai{
    justify-content:flex-start;
}

.message.user{
    justify-content:flex-end;
}

.bubble{
    max-width:min(800px,85%);
    padding:17px 20px;
    border-radius:24px;
    font-size:17px;
    line-height:1.9;
    white-space:pre-wrap;
    word-wrap:break-word;
    overflow-wrap:anywhere;
}

.ai .bubble{
    background:#17171d;
    border:1px solid #2b2b33;
    border-top-right-radius:7px;
}

.user .bubble{
    background:#25262e;
    border:1px solid #2e2f38;
    border-top-left-radius:7px;
}

/* ================= WELCOME ================= */

.welcome{
    width:100%;
    max-width:650px;
    margin:10px auto 35px;
}

.welcome-box{
    background:#17171d;
    border:1px solid #2b2b33;
    border-radius:28px;
    padding:25px;
    text-align:center;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.welcome-icon{
    font-size:35px;
    margin-bottom:10px;
}

.welcome-title{
    color:#00f5d4;
    font-size:23px;
    font-weight:bold;
    margin-bottom:10px;
}

.welcome-text{
    color:#ddd;
    font-size:16px;
    line-height:1.9;
}

/* ================= TYPING ================= */

.typing{
    display:flex;
    align-items:center;
    gap:6px;
    min-width:65px;
}

.typing span{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#777;
    animation:typing 1.2s infinite;
}

.typing span:nth-child(2){
    animation-delay:.15s;
}

.typing span:nth-child(3){
    animation-delay:.3s;
}

@keyframes typing{
    0%,60%,100%{
        transform:translateY(0);
        opacity:.35;
    }
    30%{
        transform:translateY(-5px);
        opacity:1;
    }
}

/* ================= INPUT ================= */

.input-area{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:15px 25px 22px;
    background:
        linear-gradient(
            to bottom,
            rgba(9,9,13,0),
            rgba(9,9,13,.95) 25%,
            #09090d 55%
        );
}

.input-wrapper{
    width:100%;
    max-width:850px;
    margin:auto;

    background:#17171d;
    border:1px solid #303038;
    border-radius:27px;

    display:flex;
    align-items:flex-end;
    gap:10px;

    padding:9px;
    box-shadow:0 -10px 40px rgba(0,0,0,.25);
}

textarea{
    flex:1;

    resize:none;

    background:transparent;
    border:0;
    outline:none;

    color:#fff;

    font-size:17px;
    line-height:1.6;

    min-height:52px;
    max-height:150px;

    padding:12px 10px;

    direction:rtl;
}

textarea::placeholder{
    color:#68686f;
}

.send{
    flex:0 0 58px;
    width:58px;
    height:58px;

    border:0;
    border-radius:20px;

    background:#fff;
    color:#000;

    font-size:25px;
    font-weight:bold;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.2s;
}

.send:hover{
    transform:scale(1.04);
}

.send:active{
    transform:scale(.94);
}

.send:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* ================= ACTIONS ================= */

.actions{
    max-width:850px;
    margin:7px auto 0;

    display:flex;
    justify-content:flex-start;
}

.clear{
    background:transparent;
    color:#777;
    border:0;
    font-size:12px;
    cursor:pointer;
    padding:4px 8px;
}

.clear:hover{
    color:#fff;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .header{
        height:115px;
        min-height:115px;
        padding:16px 20px;
    }

    .brand h1{
        font-size:24px;
    }

    .connection{
        font-size:15px;
    }

    .chat{
        padding:25px 12px 145px;
    }

    .bubble{
        max-width:90%;
        font-size:16px;
        padding:14px 16px;
    }

    .input-area{
        padding:10px 12px 17px;
    }

    .input-wrapper{
        border-radius:23px;
    }

    textarea{
        font-size:16px;
    }

    .send{
        width:55px;
        height:55px;
        flex-basis:55px;
    }

}

/* ================= CODE ================= */

pre{
    direction:ltr;
    text-align:left;
    background:#0b0b0f;
    border:1px solid #292930;
    border-radius:12px;
    padding:15px;
    margin:10px 0;
    overflow-x:auto;
}

code{
    font-family:monospace;
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <div class="brand">
            <h1>NEGM AI - Pro</h1>
            <p>AI Assistant</p>
        </div>

        <div class="connection">
            Connected &amp;<br>
            <span class="dot"></span>
            Active
        </div>

    </header>


    <!-- CHAT -->

    <main class="chat" id="chat">

        <div class="welcome">

            <div class="welcome-box">

                <div class="welcome-icon">⚡</div>

                <div class="welcome-title">
                    أهلاً بك يا نجم
                </div>

                <div class="welcome-text">
                    تم ربط النظام بالذكاء الاصطناعي.
                    اكتب طلبك في الأسفل لبدء المحادثة.
                </div>

            </div>

        </div>

    </main>


    <!-- INPUT -->

    <div class="input-area">

        <div class="input-wrapper">

            <textarea
                id="messageInput"
                rows="1"
                placeholder="اكتب طلبك البرمجي أو التقني بحرية..."
            ></textarea>

            <button
                class="send"
                id="sendButton"
                type="button"
            >
                ➤
            </button>

        </div>

        <div class="actions">
            <button class="clear" id="clearButton">
                مسح المحادثة
            </button>
        </div>

    </div>

</div>


<script>

/* =========================================================
   🔑 إعدادات الـ API
   ========================================================= */

const API_KEY = "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";

// استخدام بروكسي بديل يعتمد على تفعيل الـ CORS بمرونة عالية
const API_URL =
    "https://api.allorigins.win/raw?url=" +
    encodeURIComponent("https://router.huggingface.co/v1/chat/completions");

const MODEL =
    "openai/gpt-oss-120b:fastest";


/* =========================================================
   عناصر الصفحة
   ========================================================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const clearButton =
    document.getElementById("clearButton");


/* =========================================================
   ذاكرة المحادثة
   ========================================================= */

let messages = [];


/* =========================================================
   إضافة رسالة
   ========================================================= */

function addMessage(text, type){

    const row =
        document.createElement("div");

    row.className =
        "message " + type;

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;

    row.appendChild(bubble);

    chat.appendChild(row);

    scrollBottom();

    return bubble;
}


/* =========================================================
   Loading
   ========================================================= */

function addTyping(){

    const row =
        document.createElement("div");

    row.className =
        "message ai";

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble typing";

    bubble.innerHTML =
        "<span></span><span></span><span></span>";

    row.appendChild(bubble);

    chat.appendChild(row);

    scrollBottom();

    return row;
}


/* =========================================================
   Scroll
   ========================================================= */

function scrollBottom(){

    setTimeout(() => {

        chat.scrollTop =
            chat.scrollHeight;

    },20);
}


/* =========================================================
   إرسال الرسالة
   ========================================================= */

async function sendMessage(){

    const text =
        input.value.trim();

    if(!text){
        return;
    }


    /* تحقق من الـ API Key */

    if(
        !API_KEY ||
        API_KEY ===
        "PUT_YOUR_HUGGINGFACE_TOKEN_HERE"
    ){

        addMessage(
            "ضع Hugging Face API Token داخل API_KEY أولاً.",
            "ai"
        );

        return;
    }


    /* عرض رسالة المستخدم */

    addMessage(
        text,
        "user"
    );


    messages.push({
        role:"user",
        content:text
    });


    input.value = "";

    resizeInput();

    sendButton.disabled = true;


    /* Loading */

    const loading =
        addTyping();


    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Authorization":
                            "Bearer " + API_KEY,

                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        model:MODEL,

                        messages:messages,

                        temperature:0.7,

                        max_tokens:4096,

                        stream:false

                    })
                }
            );


        /*
         * قراءة الاستجابة
         */

        const raw =
            await response.text();


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status +
                "\n" +
                raw
            );
        }


        let data;

        try{

            data =
                JSON.parse(raw);

        }catch(e){

            throw new Error(
                "استجابة غير صالحة من الـAPI:\n" +
                raw
            );

        }


        /*
         * استخراج الإجابة
         */

        const answer =
            data?.choices?.[0]?.message?.content
            ||
            data?.choices?.[0]?.text
            ||
            data?.generated_text
            ||
            data?.response;


        if(!answer){

            throw new Error(
                "الـAPI لم يرجع نصًا مفهومًا."
            );

        }


        /*
         * حذف Loading
         */

        loading.remove();


        /*
         * إضافة رد AI
         */

        addMessage(
            answer,
            "ai"
        );


        /*
         * حفظ الرد في المحادثة
         */

        messages.push({

            role:"assistant",

            content:answer

        });


    }catch(error){

        loading.remove();


        addMessage(
            "حدث خطأ في الاتصال:\n\n" +
            error.message,
            "ai"
        );

        console.error(
            "NEGM AI ERROR:",
            error
        );

    }


    sendButton.disabled = false;

    input.focus();

}


/* =========================================================
   تكبير مربع الكتابة
   ========================================================= */

function resizeInput(){

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            150
        ) + "px";
}


input.addEventListener(
    "input",
    resizeInput
);


/* =========================================================
   Enter للإرسال
   Shift + Enter = سطر جديد
   ========================================================= */

input.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   زر الإرسال
   ========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   مسح المحادثة
   ========================================================= */

clearButton.addEventListener(
    "click",
    function(){

        messages = [];

        chat.innerHTML = "";

        const welcome =
            document.createElement("div");

        welcome.className =
            "welcome";

        welcome.innerHTML = `
            <div class="welcome-box">
                <div class="welcome-icon">⚡</div>
                <div class="welcome-title">
                    أهلاً بك يا نجم
                </div>
                <div class="welcome-text">
                    تم بدء محادثة جديدة.
                    اكتب رسالتك للبدء.
                </div>
            </div>
        `;

        chat.appendChild(welcome);

    }
);

</script>

</body>
</html>
